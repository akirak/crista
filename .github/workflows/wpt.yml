name: Web Platform Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  wpt:
    name: Chrome WPT
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and WPT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      - name: Build Crista
        run: opam exec -- dune build

      - name: Configure WPT hostnames
        run: vendor/wpt/wpt make-hosts-file | sudo tee -a /etc/hosts > /dev/null

      - name: Check Chrome
        run: google-chrome-stable --version

      - name: Run Web Platform Tests
        env:
          WPT_ROOT: ${{ github.workspace }}/vendor/wpt
          BROWSER: chrome
        run: ./scripts/run-wpt.sh --yes --headless
